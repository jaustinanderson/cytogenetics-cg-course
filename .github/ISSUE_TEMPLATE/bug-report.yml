name: Bug report
description: Report incorrect application behavior or a repository-tooling problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest reliable sequence of steps.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 150 on ChromeOS

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include console output, screenshots, or affected IDs without private data.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed PHI, accession numbers, credentials, and employer-confidential information.
          required: true
